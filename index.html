<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro AI Voice Mock Interview Suite</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --border-color: #1f2937;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 20px;
        }

        .app-header {
            background: #1f2937;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .app-header h2 {
            margin: 0;
            font-size: 20px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lang-selector {
            background: #0f172a;
            padding: 12px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }

        .lang-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .chat-body {
            padding: 25px 30px;
            height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--bg-color);
        }

        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.ai {
            background: #1e293b;
            color: #93c5fd;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.user {
            background: var(--accent-color);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .app-footer {
            padding: 20px 30px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        #statusText {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-start { background: var(--success-color); color: white; }
        .btn-stop { background: var(--danger-color); color: white; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .pulsing {
            animation: pulse-animation 1.5s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <h2>🤖 Pro AI Voice Mock Interview Suite</h2>
            <span id="connectionBadge" style="font-size: 12px; color: var(--success-color);">Ready</span>
        </div>

        <!-- Language Selector Bar -->
        <div class="lang-selector">
            <span style="font-size: 14px; color: var(--text-muted);">Select Interview Language:</span>
            <button class="lang-btn active" id="langBn" onclick="setLanguage('bn')">Bangla</button>
            <button class="lang-btn" id="langEn" onclick="setLanguage('en')">English</button>
        </div>

        <!-- Main Conversation Area -->
        <div class="chat-body" id="chatContainer">
            <div class="message ai" id="welcomeMsg">আসসালামু আলাইকুম! আমি আপনার এআই হায়ারিং ম্যানেজার। বাংলাতে ইন্টারভিউ শুরু করার জন্য নিচে "Start Interview" বাটনে ক্লিক করুন।</div>
        </div>

        <!-- Footer Control Bar -->
        <div class="app-footer">
            <span id="statusText">Session inactive</span>
            <div class="btn-group">
                <button class="btn btn-start" id="startBtn" onclick="initInterview()">Start Interview</button>
                <button class="btn btn-stop" id="stopBtn" onclick="stopInterview()" disabled>End Session</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "AQ.Ab8RN6JQJYTuKFYMyFmNw-p2pXvogPO-yp7DLZcq03djDaZJXg";

        let recognition = null;
        let isSessionActive = false;
        let conversationHistory = [];
        let currentLang = 'bn';

        function setLanguage(lang) {
            if (isSessionActive) {
                alert("ইন্টারভিউ চলাকালীন ভাষা পরিবর্তন করা যাবে না। প্রথমে সেশন শেষ করুন।");
                return;
            }
            currentLang = lang;
            document.getElementById('langBn').classList.toggle('active', lang === 'bn');
            document.getElementById('langEn').classList.toggle('active', lang === 'en');

            const welcomeEl = document.getElementById('welcomeMsg');
            if (lang === 'bn') {
                welcomeEl.innerText = 'আসসালামু আলাইকুম! আমি আপনার এআই হায়ারিং ম্যানেজার। বাংলাতে ইন্টারভিউ শুরু করার জন্য "Start Interview" বাটনে ক্লিক করুন।';
            } else {
                welcomeEl.innerText = 'Hello! I am your AI hiring manager. Click "Start Interview" to begin your interview in English.';
            }
        }

        function appendMessage(sender, text) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function initInterview() {
            isSessionActive = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('startBtn').classList.add('pulsing');
            document.getElementById('statusText').innerText = currentLang === 'bn' ? "এআই কথা বলছে..." : "AI is speaking...";
            document.getElementById('connectionBadge').innerText = "Live Connected";

            let systemPrompt = currentLang === 'bn' 
                ? "You are a professional corporate hiring manager conducting a live mock interview. You MUST reply ONLY in pure native Bengali script (বাংলা হরফ). Never use English letters or Banglish for Bengali text. Keep your questions concise, formal, and realistic one by one based on user responses."
                : "You are a professional corporate hiring manager conducting a live mock interview entirely in English. Ask concise, realistic interview questions one by one based on user responses.";

            conversationHistory = [{
                role: "user",
                parts: [{ text: systemPrompt }]
            }];

            let welcomeText = currentLang === 'bn'
                ? "আসসালামু আলাইকুম! আমাদের মক ইন্টারভিউতে আপনাকে স্বাগতম। দয়া করে আপনার পরিচয় এবং কোন পদের জন্য আপনার আবেদন, তা সংক্ষেপে বলুন।"
                : "Hello and welcome to your mock interview session. Could you please introduce yourself and state your target role?";
            
            aiSpeakAndListen(welcomeText);
        }

        function stopInterview() {
            isSessionActive = false;
            if (recognition) recognition.stop();
            window.speechSynthesis.cancel();
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('startBtn').classList.remove('pulsing');
            document.getElementById('statusText').innerText = "Session ended";
            document.getElementById('connectionBadge').innerText = "Ready";
        }

        function aiSpeakAndListen(text) {
            appendMessage('ai', text);
            conversationHistory.push({ role: "model", parts: [{ text: text }] });

            if (currentLang === 'bn') {
                // Google TTS Audio Stream bypasses browser voice pack limitations for native Bengali
                const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=bn&client=tw-ob`;
                const audio = new Audio(audioUrl);
                
                audio.play().then(() => {
                    audio.onended = function() {
                        if (isSessionActive) {
                            startVoiceRecognition();
                        }
                    };
                }).catch(err => {
                    // Fallback if audio fails to auto-play
                    if (isSessionActive) {
                        setTimeout(() => startVoiceRecognition(), 1500);
                    }
                });
            } else {
                // English uses standard browser SpeechSynthesis
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.95;

                utterance.onend = function() {
                    if (isSessionActive) {
                        startVoiceRecognition();
                    }
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("আপনার ব্রাউজারে স্পিচ রিকগনিশন সাপোর্ট করছে না। Google Chrome ব্যবহার করুন।");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = currentLang === 'bn' ? 'bn-BD' : 'en-US';

            document.getElementById('statusText').innerText = currentLang === 'bn' ? "শুনছি... এখন কথা বলুন!" : "Listening... Speak now!";

            recognition.onresult = function(event) {
                const userSpeech = event.results[0][0].transcript;
                appendMessage('user', userSpeech);
                document.getElementById('statusText').innerText = currentLang === 'bn' ? "এআই চিন্তা করছে..." : "AI is thinking...";
                
                sendToGeminiAPI(userSpeech);
            };

            recognition.onerror = function(event) {
                if (isSessionActive) {
                    setTimeout(() => startVoiceRecognition(), 1000);
                }
            };

            try {
                recognition.start();
            } catch(e) {}
        }

        async function sendToGeminiAPI(userText) {
            conversationHistory.push({ role: "user", parts: [{ text: userText }] });

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: conversationHistory })
                });

                const data = await res.json();
                if (data.candidates && data.candidates[0].content) {
                    const replyText = data.candidates[0].content.parts[0].text;
                    aiSpeakAndListen(replyText);
                } else {
                    aiSpeakAndListen(currentLang === 'bn' ? "দুঃখিত, বুঝতে পারিনি। দয়া করে আবার বলবেন কি?" : "I didn't catch that, could you please repeat?");
                }
            } catch (err) {
                aiSpeakAndListen(currentLang === 'bn' ? "নেটওয়ার্ক সমস্যা হয়েছে, দয়া করে আবার চেষ্টা করুন।" : "Network error occurred, please try again.");
            }
        }
    </script>
</body>
</html>
